[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evcca"
version = "1.0.0"
description = "Grouping of soil test results under variability and borehole-continuity constraints"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Nikita Tishin", email = "itishinn@gmail.com" },
  { name = "Oleg Ozmidov" },
]
keywords = ["geotechnics", "engineering-geological element", "constrained clustering", "set partitioning"]
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "nbconvert>=7", "ipykernel>=6"]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/tnick1502/evcc-a"

[project.scripts]
evcca-reproduce = "evcca.study.reproduce:main"
evcca-verify = "evcca.study.verify:main"
evcca-figures = "evcca.study.figures:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B905", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["evcca"]
known-local-folder = ["helpers"]
